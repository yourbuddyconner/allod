- create:
    kind: node
    id: 88c1afe4-2120-4d00-b68c-83a914300232
    type: meta/Policy@1
    attributes:
      name: memory-local
      definition: |
        policy: memory-local
        version: 1
        default_posture: restricted
        roles:
          owner:
          - principal:conner
        rules:
        - name: schema-changes-are-serious
          select:
            operation:
            - define-type
            - set-policy
            - deprecate-term
          require:
            reviewers:
              role: owner
              quorum: 1
        - name: scratch-is-free
          select:
            all:
            - author_kind: agent
            - region: workspace/scratch
          require:
            schema_valid: true
        - name: agent-writes-are-proposals
          select:
            all:
            - author_kind: agent
            - not:
                region: workspace/scratch
          require:
            reviewers:
              role: owner
              quorum: 1
        - name: preferences-are-owner-business
          select:
            type: memory/Preference
          require:
            reviewers:
              role: owner
              quorum: 1
        - name: private-region-guarded
          select:
            region: sensitivity/private
          require:
            reviewers:
              role: owner
              quorum: 1
        - name: model-assisted-needs-signed-envelope
          select:
            all:
            - basis: model-assisted
            - not:
                region: workspace/scratch
          require:
            attestation_required:
              attester_class: indexer
