[package]
name = "allod-core"
version = "0.1.0"
edition = "2021"
description = "Core domain model for Allod tooling: spec vocabulary, package and taxonomy registries, reference resolution, and the attribute type grammar"
license = "MIT OR Apache-2.0"

[dependencies]
serde = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
zeroize = "1"
