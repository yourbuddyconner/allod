[package]
name = "allod-graph"
version = "0.1.0"
edition = "2021"
description = "Generic operations layer for allod governed knowledge graphs"
license = "MIT OR Apache-2.0"

[dependencies]
allod-core = { path = "../allod-core" }
allod-substrate = { path = "../allod-substrate" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"
rand = "0.8"

[features]
default = ["native"]
native = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
