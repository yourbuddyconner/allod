# core — base ontology, version 1 (projection form, §2.5)
#
# The minimal shared vocabulary. Principals (§6.1), peers (§9.3), and
# grants (§9.4) are ordinary entity types here, which is what makes
# identity and sharing governed, provenance-carrying history like
# everything else in a graph.

ontology: core
version: 1

structs:

  # A principal's key record (§6.2). algorithm stays a string because
  # the algorithm set is registry-open; the required pair is ed25519
  # and ecdsa-p256. public carries the key bytes themselves (hex):
  # key_id alone is a hash and cannot verify a signature.
  KeyRecord:
    key_id:      { type: string, required: true }
    algorithm:   { type: string, required: true }
    public:      { type: string, required: true }
    valid_from:  { type: timestamp }
    valid_until: { type: timestamp }
    status:      { type: "enum<active|rotated|revoked>", required: true }

entity_types:

  Person:
    attributes:
      name:        { type: string, required: true }
      emails:      { type: list<string> }
      affiliation: { type: node-ref, target: Company }

  Company:
    attributes:
      name:    { type: string, required: true }
      domains: { type: list<string> }

  # Principals (§6.1). The kind is the type, and policy selectors key
  # on it. Key records are the KeyRecord struct (§6.2).

  User:
    attributes:
      display_name: { type: string, required: true }
      keys:         { type: list<KeyRecord>, required: true }
      status:       { type: "enum<active|suspended>" }

  Service:
    attributes:
      display_name: { type: string, required: true }
      keys:         { type: list<KeyRecord>, required: true }
      status:       { type: "enum<active|suspended>" }

  Agent:
    attributes:
      display_name: { type: string, required: true }
      keys:         { type: list<KeyRecord>, required: true }
      status:       { type: "enum<active|suspended>" }
      delegated_by: { type: node-ref, target: User, required: true }   # §6.1
      scope:        { type: selector }                # delegation scope, §4.1 grammar

  # Federation objects (Part 9).

  Peer:
    attributes:
      graph_id:    { type: string, required: true }   # genesis hash (§9.2)
      root_keys:   { type: list<string>, required: true }
      locators:    { type: list<string> }             # fetch hints, ordered
      trust_basis: { type: "enum<out-of-band|tofu|attested>" }   # §9.3

  Grant:
    # The issuer signs the changeset that creates the grant, so
    # issuance needs no separate signature field (§9.4).
    attributes:
      audience:    { type: string, required: true }   # principal ref, graph ID, or public
      scope:       { type: selector, required: true } # §4.1 grammar, machine-checked
      rights:      { type: "list<enum<state|history|subscribe>>", required: true }  # §9.4
      valid_from:  { type: timestamp }
      valid_until: { type: timestamp }

edge_types:
  employs: { domain: Company, range: Person, cardinality: one-to-many }
  knows:   { domain: Person,  range: Person, cardinality: many-to-many,
             attributes: { since: { type: date } } }
