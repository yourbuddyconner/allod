# supply-baseline — reference governance policy for a supply chain
# graph (projection form, §2.5)

policy: supply-baseline
version: 1
default_posture: restricted
roles:
  owner:   [ "principal:…" ]
  quality: [ "principal:…" ]
rules:

  - name: certifications-are-quality-business
    select: { type: supply/Certification }
    require:
      reviewers: { role: quality, quorum: 1 }

  - name: agent-writes-are-proposals
    select: { author_kind: agent }
    require:
      reviewers: { role: quality, quorum: 1 }

  # Imported knowledge routes through admission under its own key
  # (§4.1 imported, §9.6): a foreign graph's standards are its own.
  # Lineage is author-asserted below L3, and this is a tightening
  # rule, which is the safe direction for an asserted input (§4.8).
  - name: imports-need-quality-review
    select: { imported: true }
    require:
      reviewers: { role: quality, quorum: 1 }

  - name: disclosure-changes-are-owner-business
    select: { region: "disclosure" }
    require:
      reviewers: { role: owner, quorum: 1 }

  - name: model-assisted-needs-attestation
    select: { basis: model-assisted }
    require:
      attestation_required: { attester_class: attested-indexer }
