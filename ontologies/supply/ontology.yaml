# supply — supply chain ontology, version 1 (projection form, §2.5)
#
# Parts, batches, facilities, and the certifications that make them
# trustworthy across organizational boundaries.

ontology: supply
version: 1
imports:
  - { ontology: core, state_hash: "sha256:a48eb0cd7e8c2ad6a36067a387077d6ba68f034e7186a6adb78ccf000fd05087" }

entity_types:

  Part:
    attributes:
      name:        { type: string, required: true }
      sku:         { type: string }
      description: { type: string }

  Batch:
    attributes:
      lot:         { type: string, required: true }
      produced_on: { type: date }
      quantity:    { type: int }

  Facility:
    attributes:
      name:     { type: string, required: true }
      location: { type: string }
      operator: { type: node-ref, target: core/Company }

  Certification:
    attributes:
      standard:    { type: string, required: true }   # e.g. "RMI conflict-free"
      issued_on:   { type: date, required: true }
      expires_on:  { type: date }
      certificate: { type: document-ref, required: true }  # the certificate bytes
    constraints:
      - "expires_on >= issued_on"

  Shipment:
    attributes:
      shipped_on:  { type: date, required: true }
      received_on: { type: date }
      quantity:    { type: int }

  Inspection:
    attributes:
      performed_on: { type: date, required: true }
      result:       { type: "enum<pass|fail>" }
      report:       { type: document-ref }

edge_types:
  makes:         { domain: Facility, range: Part, cardinality: many-to-many }
  of_part:       { domain: Batch, range: Part, cardinality: many-to-one }
  produced_at:   { domain: Batch, range: Facility, cardinality: many-to-one }
  component_of:  { domain: Part, range: Part, cardinality: many-to-many,
                   attributes: { quantity: { type: int } } }   # the bill of materials
  contains:      { domain: Shipment, range: Batch, cardinality: many-to-many }
  from_facility: { domain: Shipment, range: Facility, cardinality: many-to-one }
  to_facility:   { domain: Shipment, range: Facility, cardinality: many-to-one }
  certifies:     { domain: Certification, range: [Facility, Part, Batch], cardinality: many-to-many }
  issued_by:     { domain: Certification, range: core/Company, cardinality: many-to-one }
  inspected:     { domain: Inspection, range: [Batch, Facility], cardinality: many-to-many }

# Structured per the §2.1 rule grammar. The old
# certifications-anchor-to-bytes rule is gone: the attribute schema
# already requires the certificate ref, and whether its hash resolves
# is verification territory (§5.3 degraded results), not admission.
validation_rules:
  - name: shipments-have-contents
    on: { type: Shipment, operation: [create] }
    require:
      edge: { type: contains, direction: out, min: 1, within: changeset }
