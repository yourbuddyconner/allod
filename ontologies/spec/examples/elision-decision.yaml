# The issue that forced the design, and the decision that resolved it.
---
kind: node
id: "is09…"
rev: "sha256:9is0…"
type: spec/Issue@1
attributes:
  description: "Scoped federation shares need authentic history slices: a receiver must verify signatures on changesets whose out-of-scope operations it cannot see"
  status: "resolved"
---
kind: node
id: "dd14…"
rev: "sha256:dd14…"
type: spec/DesignDecision@1
attributes:
  summary: "Hash changesets over a Merkle root of operations instead of the raw list"
  rationale: "Elision keeps signatures verifiable over partial disclosure, and the same leaf-hash mechanism gives redact-operation a way to remove content without breaking chains. Cost: more complex hashing, accepted while the spec is pre-v1."
  status: "adopted"
---
kind: edge
type: spec/resolved_by@1
from: "node:is09…"
to: "node:dd14…"
---
kind: edge
type: spec/affects@1
from: "node:dd14…"
to: "node:sc26…"

