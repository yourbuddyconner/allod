# research — claims and evidence ontology, version 1 (projection form, §2.5)
#
# Knowledge as claims anchored to sources. The evidence chain is edges
# plus lineage, so verification walks the graph instead of trusting
# the prose.

ontology: research
version: 1
imports:
  - { ontology: core, state_hash: "sha256:0104f218ef5562f9c628f1fd394dee82e157b31ac8a6332f613630f68c396649" }

entity_types:

  Question:
    attributes:
      statement: { type: string, required: true }
      status:    { type: "enum<open|answered>" }

  Claim:
    attributes:
      statement:  { type: string, required: true }
      confidence: { type: decimal }               # 0 to 1
      status:     { type: "enum<asserted|contested|retracted>" }

  Source:
    attributes:
      title:        { type: string, required: true }
      kind:         { type: "enum<paper|article|dataset|webpage|transcript>" }
      published_on: { type: date }
      content:      { type: document-ref, required: true }   # the exact bytes

  Quotation:
    attributes:
      text:     { type: string, required: true }
      location: { type: string }                  # page, section, or span

  Dataset:
    attributes:
      name:    { type: string, required: true }
      format:  { type: string }
      content: { type: document-ref }

edge_types:
  quotes:      { domain: Quotation, range: Source, cardinality: many-to-one }
  cites:       { domain: Claim, range: [Source, Quotation, Dataset], cardinality: many-to-many }
  supports:    { domain: [Claim, Quotation, Dataset], range: Claim, cardinality: many-to-many }
  contradicts: { domain: [Claim, Quotation, Dataset], range: Claim, cardinality: many-to-many }
  answers:     { domain: Claim, range: Question, cardinality: many-to-many }
  supersedes:  { domain: Claim, range: Claim, cardinality: one-to-one }
  authored_by: { domain: Source, range: core/Person, cardinality: many-to-many }

# Structured per the §2.1 rule grammar. A synthesis claim rests on
# inbound supports edges from other claims, hence the any.
validation_rules:
  - name: claims-cite-evidence
    on: { type: Claim, operation: [create] }
    require:
      any:
        - { edge: { type: cites, direction: out, min: 1, within: changeset } }
        - { edge: { type: supports, direction: in, min: 1, within: changeset } }
  - name: contested-claims-show-the-conflict
    on:
      type: Claim
      where: { attr: status, equals: contested }
    require:
      edge: { type: contradicts, direction: in, min: 1 }
