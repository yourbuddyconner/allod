# memory-baseline — reference governance policy for a personal memory
# graph (projection form, §2.5)
#
# One human, one or more delegated agents. The owner role binds to the
# root authority at genesis.

policy: memory-baseline
version: 1
default_posture: restricted
roles:
  owner: [ "principal:…" ]
rules:

  - name: agent-writes-are-proposals
    select:
      all:
        - { author_kind: agent }
        - { not: { region: "workspace/scratch" } }  # scratch is the carve-out
    require:
      reviewers: { role: owner, quorum: 1 }

  # The agent can propose a preference. Only the owner can make it true.
  - name: preferences-are-owner-business
    select: { type: memory/Preference }
    require:
      reviewers: { role: owner, quorum: 1 }

  - name: private-region-guarded
    select: { region: "sensitivity/private" }
    require:
      reviewers: { role: owner, quorum: 1 }

  # Scratch is exempt here too. Carve-outs do not compose across rules
  # (§4.1), so the clause from agent-writes-are-proposals repeats.
  # Without it, every scratch note with model-assisted lineage would
  # need an attestation envelope, and the agent could not think at
  # full speed there.
  - name: model-assisted-needs-attestation
    select:
      all:
        - { basis: model-assisted }
        - { not: { region: "workspace/scratch" } }
    require:
      attestation_required: { attester_class: attested-indexer }
