# memory — personal agent memory ontology, version 1 (projection form, §2.5)
#
# What an assistant learns about its owner: observations, preferences,
# routines, and commitments, all provenance-carrying and governed.

ontology: memory
version: 1
imports:
  - { ontology: core, state_hash: "sha256:a48eb0cd7e8c2ad6a36067a387077d6ba68f034e7186a6adb78ccf000fd05087" }

entity_types:

  Note:
    attributes:
      title:   { type: string }
      content: { type: string, required: true, long_text: true }  # projects to the markdown body (§7.2)

  Preference:
    attributes:
      statement: { type: string, required: true } # e.g. "no meetings before 09:00"
      strength:  { type: "enum<hard|soft>" }
      context:   { type: string }                 # when it applies

  Routine:
    attributes:
      name:        { type: string, required: true }
      cadence:     { type: string }               # e.g. "weekly, Monday morning"
      description: { type: string, long_text: true }  # projects to the markdown body (§7.2)

  Commitment:
    attributes:
      description: { type: string, required: true }
      due_at:      { type: timestamp }
      status:      { type: "enum<open|done|dropped>" }

  Interest:
    attributes:
      topic:    { type: string, required: true }
      affinity: { type: "enum<growing|steady|fading>" }

edge_types:
  about:      { domain: [Note, Preference, Commitment, Routine], range: [core/Person, core/Company, Interest], cardinality: many-to-many }
  owed_to:    { domain: Commitment, range: core/Person, cardinality: many-to-one }
  supersedes: { domain: Preference, range: Preference, cardinality: one-to-one }
  # Any memory item can point at the item it grew from — a promoted
  # preference keeps a link to the scratch note that suggested it.
  # Note-to-Note alone made that lineage inexpressible; found by the
  # reference implementation's domain checks.
  relates_to: { domain: [Note, Preference, Routine, Commitment],
                range: [Note, Preference, Routine, Commitment], cardinality: many-to-many }
